services:
  # 1. Backend Web Service (Node.js / Express / Prisma)
  - type: web
    name: hitam-transport-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma db push && node prisma/seed.js
    startCommand: node src/server.js
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hitam-transport-db
          property: connectionString
      - key: CLIENT_URL
        fromService:
          type: web
          name: hitam-transport-frontend
          property: host

  # 2. Frontend Static Site (React / Vite / Tailwind)
  - type: web
    name: hitam-transport-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: hitam-transport-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# 3. Managed PostgreSQL Database
databases:
  - name: hitam-transport-db
    databaseName: hitam_transport
    user: hitam_admin
    plan: free
