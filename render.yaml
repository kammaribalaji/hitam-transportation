# Render Blueprint — HITAM Transport
# Docs: https://render.com/docs/blueprint-spec
#
# Provisions three resources from this repo:
#   1. A free PostgreSQL database
#   2. The Express + Prisma API (backend/)
#   3. The React static site (frontend/), which proxies /api/* to the API
#
# How to deploy:
#   1. Push this repo to GitHub.
#   2. https://render.com -> New -> Blueprint -> select the repo.
#   3. Enter your HypeGPS API hash when prompted (HYPEGPS_API_HASH).
#   4. Create. Render applies the schema migrations, seeds Route 12 demo
#      data once, and deploys both services automatically.
#
# Notes:
#   - JWT_SECRET is generated randomly by Render (never committed).
#   - If a service subdomain is already taken, Render appends a suffix —
#     then update CLIENT_URL (API service) and the /api/* rewrite
#     destination (web service) in the Render dashboard.

databases:
  - name: hitam-transport-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: college_transport
    user: hitam_transport

services:
  # ---------------- API (Express + Prisma) ----------------
  - type: web
    name: hitam-transport-api
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate
    # Applies pending Prisma migrations before each deploy goes live.
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    # Runs once after the FIRST successful deploy: loads the Route 12 sheet
    # demo data (users, bookings, payments, seats, trips, GPS mapping).
    initialDeployHook: npm run seed
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hitam-transport-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Frontend origin allowed by CORS. Only used for direct cross-origin
      # API calls — normal traffic is same-origin via the /api/* rewrite.
      - key: CLIENT_URL
        value: https://hitam-transport-web.onrender.com
      - key: HYPEGPS_API_URL
        value: https://platform.hypegps.com/api/get_devices
      # Real GPS tracking. Render asks for this value during Blueprint setup;
      # it is never stored in this file or in git.
      - key: HYPEGPS_API_HASH
        sync: false

  # ---------------- Frontend (React static site) ----------------
  - type: web
    name: hitam-transport-web
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm run build
    staticPublishPath: ./dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # Send every /api/* request to the backend (same-origin from the
      # browser's point of view, so no CORS issues).
      - type: rewrite
        source: /api/*
        destination: https://hitam-transport-api.onrender.com/api/*
